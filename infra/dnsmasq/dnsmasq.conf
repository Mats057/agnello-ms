# =====================================================================
# Vinheria Agnello - servidor DHCP + DNS da rede interna (10.20.0.0/24)
# Simula o papel das funções DHCP Server e DNS Server de um Windows Server.
# =====================================================================

# ---------------------------------------------------------------- DNS
# Zona interna da empresa: tudo que termina em .vinheria.local é
# respondido aqui e nunca é repassado para fora.
domain=vinheria.local
local=/vinheria.local/
domain-needed
bogus-priv
expand-hosts

# Nomes externos (ex.: pacotes, internet) são repassados ao DNS embutido
# do Docker, que também conhece os nomes dos containers.
no-resolv
server=127.0.0.11

# Registros A + PTR dos serviços (IP fixo = "reserva" do servidor)
host-record=dns.vinheria.local,10.20.0.2
host-record=gateway.vinheria.local,10.20.0.10
host-record=auth.vinheria.local,10.20.0.11
host-record=estoque.vinheria.local,10.20.0.12
host-record=pedidos.vinheria.local,10.20.0.13
host-record=mensageria.vinheria.local,10.20.0.14
host-record=rabbitmq.vinheria.local,10.20.0.15

# Apelido amigável para o ponto de entrada
cname=api.vinheria.local,gateway.vinheria.local

# --------------------------------------------------------------- DHCP
interface=eth0
# Escopo DHCP para estações e dispositivos da adega (.150 a .199).
# Os IPs .2 a .63 são fixos (servidores) e .64 a .127 ficam com o Docker.
dhcp-range=10.20.0.150,10.20.0.199,255.255.255.0,12h
dhcp-option=option:router,10.20.0.1
dhcp-option=option:dns-server,10.20.0.2
dhcp-option=option:domain-name,vinheria.local
dhcp-authoritative
dhcp-leasefile=/var/lib/misc/dnsmasq.leases

# Clientes DHCP que informam o hostname são registrados automaticamente
# no DNS (ex.: estacao-adega.vinheria.local) - DNS dinâmico.

# --------------------------------------------------------------- Logs
# O DORA (Discover/Offer/Request/Ack) já aparece no log por padrão;
# log-queries mostra também cada consulta DNS recebida.
log-queries