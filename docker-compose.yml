services:
  gateway-service:
    image: ${IMAGE_PREFIX:-vinheria/agnello-ms}:${IMAGE_TAG:-dev}-gateway-service
    depends_on:
      auth-service:
        condition: service_started
      pedidos-service:
        condition: service_started
      estoque-service:
        condition: service_started
      mensageria-service:
        condition: service_started
    networks:
      - vinheria
    ports:
      - "${GATEWAY_PORT:-5000}:8080"

  auth-service:
    image: ${IMAGE_PREFIX:-vinheria/agnello-ms}:${IMAGE_TAG:-dev}-auth-service
    environment:
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - vinheria

  estoque-service:
    image: ${IMAGE_PREFIX:-vinheria/agnello-ms}:${IMAGE_TAG:-dev}-estoque-service
    environment:
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - vinheria

  pedidos-service:
    image: ${IMAGE_PREFIX:-vinheria/agnello-ms}:${IMAGE_TAG:-dev}-pedidos-service
    environment:
      JWT_SECRET: ${JWT_SECRET}
      ESTOQUE_URL: ${ESTOQUE_URL}
      MENSAGERIA_URL: ${MENSAGERIA_URL}
      ALLOW_SELF_SIGNED_CERT: ${ALLOW_SELF_SIGNED_CERT}
    depends_on:
      estoque-service:
        condition: service_started
      mensageria-service:
        condition: service_started
    networks:
      - vinheria

  mensageria-service:
    image: ${IMAGE_PREFIX:-vinheria/agnello-ms}:${IMAGE_TAG:-dev}-mensageria-service
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - vinheria

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - vinheria

networks:
  vinheria:
    driver: bridge
