services:
  docker:
    image: docker:29-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["--mtu=1500"]
    networks:
      - jenkins-ci
    restart: unless-stopped

  jenkins:
    build:
      context: ./jenkins
    container_name: vinheria-jenkins
    user: root
    environment:
      DOCKER_HOST: tcp://docker:2375
    depends_on:
      - docker
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - jenkins-ci
    restart: unless-stopped

volumes:
  jenkins_home:

networks:
  jenkins-ci:
